name: Build GPUI prototype

on:
  push:
    branches: [codex/gpui-prototype]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/gpui-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/gpui-prototype/target
          key: ${{ runner.os }}-gpui-${{ hashFiles('desktop/gpui-prototype/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gpui-${{ hashFiles('desktop/gpui-prototype/Cargo.lock') }}-
      - name: Build prototype
        run: cargo build --release --locked
      - name: Test receiver decoding
        run: cargo test --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: nibble-gpui-prototype-windows
          path: |
            desktop/gpui-prototype/target/release/nibble-gpui-prototype.exe
            desktop/gpui-prototype/assets/fonts/Outfit-OFL.txt
            desktop/gpui-prototype/assets/fonts/JetBrainsMono-OFL.txt
          if-no-files-found: error

  visual-windows:
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nibble-gpui-prototype-windows
          path: capture-input
      - name: Capture GPUI demo screens
        shell: pwsh
        run: ./desktop/gpui-prototype/scripts/capture-demo.ps1
      - name: Upload visual captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nibble-gpui-visual-windows
          path: visual-captures/
          if-no-files-found: warn

  reference-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the original Tauri release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force capture-input | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/mahammadismayilov/nibble/releases/download/v1.0.6/nibble-desktop.exe' -OutFile 'capture-input/nibble-reference.exe'
          $actual = (Get-FileHash -Algorithm SHA256 'capture-input/nibble-reference.exe').Hash
          if ($actual -ne 'e1fb756b2c5b15353380351d6c378ae785af688bdc429300e2ec1f1adc149bbb') { throw "Unexpected reference executable SHA-256: $actual" }
      - name: Capture the original Tauri app
        shell: pwsh
        run: ./desktop/gpui-prototype/scripts/capture-demo.ps1 -Reference
      - name: Upload reference capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nibble-tauri-reference-windows
          path: visual-captures/
          if-no-files-found: warn

