name: Build GPUI prototype

on:
  push:
    branches: [codex/gpui-prototype]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/gpui-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/gpui-prototype/target
          key: ${{ runner.os }}-gpui-${{ hashFiles('desktop/gpui-prototype/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gpui-${{ hashFiles('desktop/gpui-prototype/Cargo.lock') }}-
      - name: Build prototype
        run: cargo build --release --locked
      - name: Test receiver decoding
        run: cargo test --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: nibble-gpui-prototype-windows
          path: |
            desktop/gpui-prototype/target/release/nibble-gpui-prototype.exe
            desktop/gpui-prototype/assets/fonts/Outfit-OFL.txt
            desktop/gpui-prototype/assets/fonts/JetBrainsMono-OFL.txt
          if-no-files-found: error

