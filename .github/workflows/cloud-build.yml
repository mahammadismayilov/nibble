name: Cloud Tauri Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Build Tauri binary (no installer bundle)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --no-bundle

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nibble-windows
          path: desktop/src-tauri/target/release/nibble.exe
          if-no-files-found: warn

      - name: Upload exe to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: desktop/src-tauri/target/release/nibble.exe

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Build Tauri app & DMG for macOS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --bundles app,dmg --no-sign

      - name: Package and rename macOS release artifacts
        run: |
          if [ -d "src-tauri/target/release/bundle/macos/Nibble.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Nibble.app" "src-tauri/target/release/bundle/macos/Nibble.zip"
          fi
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              mv "$f" src-tauri/target/release/bundle/dmg/Nibble.dmg
              break
            fi
          done

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nibble-macos
          path: |
            desktop/src-tauri/target/release/bundle/dmg/Nibble.dmg
            desktop/src-tauri/target/release/bundle/macos/Nibble.zip
          if-no-files-found: warn

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/src-tauri/target/release/bundle/dmg/Nibble.dmg
            desktop/src-tauri/target/release/bundle/macos/Nibble.zip
          fail_on_unmatched_files: false
